# FLUX.2 full-cache B3-medium h512/d12 batch64 calibration. No image eval; no checkpoints.
data:
  data_path: /workspace/PDM/data/vae_latents/AutoencoderKLFlux2_d32/imagenet256_train_full
  file_glob: latents_rank00_shard*.safetensors
  expected_total: 1281167
  image_size: 256
  num_classes: 1000
  num_workers: 8
  prefetch_factor: 4
  persistent_workers: true
  shuffle: true
  drop_last: true
  latent_norm: false
  latent_multiplier: 1.0
  flip_prob: 0.5
  skip_unreadable: true
  label_preview_count: 2048
vae:
  model_name: AutoencoderKLFlux2_d32
  downsample_ratio: 8
  latent_dim: 32
  latent_shape:
  - 32
  - 32
  - 32
  latent_source: diffusers/FLUX.2-dev-bnb-4bit/subfolder=vae
  latent_mode: posterior.mode
train:
  exp_name: calib_flux2vae_b3medium_h512_d12_b64_20s_noeval
  output_dir: /workspace/PDM/experiments/2026-05-27-pdm3-ht-b3-meanflow-realdata-trainer/results
  max_steps: 20
  global_batch_size: 64
  global_seed: 20260528
  device: auto
  log_every: 2
  use_ema: true
  ema_decay: 0.9999
  sdpa_kernel: math
  allow_tf32: false
  checkpoint_every: 0
  keep_last_checkpoints: 1
  resume_from: null
  restore_rng: true
model:
  model_type: B3MeanFlowLightningDiT-Custom
  patch_size: 2
  hidden_size: 512
  depth: 12
  num_heads: 8
  in_chans: 32
  class_dropout_prob: 0.1
  use_qknorm: false
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  wo_shift: false
  use_abs_pos: true
  use_checkpoint: false
  meanflow_init_scheme: stress_nonzero
  meanflow_adaln_init_std: 0.02
  meanflow_final_linear_init: xavier
optimizer:
  lr: 0.0001
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.0
  max_grad_norm: 1.0
meanflow:
  precision_recipe: bf16_backbone_fp32_jvp
  equal_prob: 0.75
  time_sampler: ltg
  t_low: 0.05
  t_high: 0.95
  lognorm_mu: -0.4
  lognorm_sigma: 1.0
  fd_eps: 0.01
  fd_audit_every: 10
eval:
  enabled: false
  every_steps: 0
  run_at_step_1: false
  num_samples: 0
  sample_steps: 4
  precision_mode: bf16_autocast
  use_ema: true
  fixed_labels:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  fid_command_template: ''
  fid_timeout_sec: 600
