# 100M-ish B3 MeanFlow fast-fit probe over a small 64k ImageNet/PAE subset.
# Goal: quickly test fit/lower-bound behavior without another full-ImageNet long run.
# Architecture is intentionally not paper-matched: ~101.27M params, patch/1, 256 latent tokens.
# Optimization intuition: smaller model + repeated small-subset epochs tolerate a more aggressive LR.

data:
  data_path: /workspace/PDM/data/pae_latents/PAE_DINOv2L_d32/imagenet256_train_full
  file_glob: '*.safetensors'
  expected_total: 65536
  max_samples: 65536
  subset_mode: first_n_contiguous
  image_size: 256
  num_classes: 1000
  num_workers: 12
  prefetch_factor: 6
  persistent_workers: true
  shuffle: true
  drop_last: true
  latent_norm: false
  latent_multiplier: 1.0
  flip_prob: 0.5
  skip_unreadable: true
  label_preview_count: 4096

vae:
  model_name: PAE_DINOv2L_d32
  downsample_ratio: 16
  latent_dim: 32

train:
  exp_name: fitprobe_100m_subset64k_b384_lr5e4
  output_dir: /workspace/PDM/experiments/2026-05-27-pdm3-ht-b3-meanflow-realdata-trainer/results
  max_steps: 20000
  global_batch_size: 384
  global_seed: 20260530
  device: auto
  log_every: 50
  use_ema: true
  ema_decay: 0.999
  sdpa_kernel: default
  allow_tf32: true
  checkpoint_every: 2000
  keep_last_checkpoints: 12
  resume_from: auto
  restore_rng: false

model:
  model_type: B3MeanFlowLightningDiT-Custom
  in_chans: 32
  patch_size: 1
  hidden_size: 512
  depth: 21
  num_heads: 8
  mlp_ratio: 4.0
  class_dropout_prob: 0.0
  use_qknorm: false
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  wo_shift: false
  use_abs_pos: true
  use_checkpoint: false
  meanflow_init_scheme: official_zero
  meanflow_adaln_init_std: 0.02
  meanflow_final_linear_init: official_zero

optimizer:
  lr: 0.0005
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.03
  max_grad_norm: 1.0
  min_lr: 0.00005
  scheduler: cosine
  warmup_steps: 500
  decay_end_step: 20000

meanflow:
  precision_recipe: bf16_backbone_fp32_jvp
  equal_prob: 0.75
  time_sampler: ltg
  t_low: 0.05
  t_high: 0.95
  lognorm_mu: -0.4
  lognorm_sigma: 1.0
  fd_eps: 0.01
  fd_audit_every: 0

eval:
  enabled: true
  every_steps: 2000
  run_at_step_1: false
  num_samples: 64
  sample_steps: 16
  precision_mode: bf16_autocast
  use_ema: true
  fixed_labels: null
  fid_command_template: ''
  fid_timeout_sec: 1800
