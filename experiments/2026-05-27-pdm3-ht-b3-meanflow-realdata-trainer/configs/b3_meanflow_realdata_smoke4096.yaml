# Phase-0/B3 MeanFlow real-data training-loop smoke.
# Uses already-built 4096 real ImageNet PAE latents while full cache runs in background.

data:
  data_path: /workspace/PDM/data/pae_latents/PAE_DINOv2L_d32/imagenet256_train_full_smoke4096_opt
  file_glob: "*.safetensors"
  expected_total: 4096
  image_size: 256
  num_classes: 1000
  num_workers: 2
  prefetch_factor: 2
  persistent_workers: true
  shuffle: true
  drop_last: true
  latent_norm: false
  latent_multiplier: 1.0
  flip_prob: 0.5
  skip_unreadable: true
  label_preview_count: 2048

vae:
  model_name: PAE_DINOv2L_d32
  downsample_ratio: 16
  latent_dim: 32

train:
  exp_name: smoke_realdata_4096
  output_dir: /workspace/PDM/experiments/2026-05-27-pdm3-ht-b3-meanflow-realdata-trainer/results
  max_steps: 6
  global_batch_size: 4
  global_seed: 20260527
  device: auto
  log_every: 1
  use_ema: true
  ema_decay: 0.9999
  sdpa_kernel: math
  allow_tf32: false
  checkpoint_every: 3
  keep_last_checkpoints: 4
  resume_from: null
  restore_rng: true

model:
  model_type: B3MeanFlowLightningDiT-Tiny/1
  in_chans: 32
  class_dropout_prob: 0.1
  use_qknorm: false
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  wo_shift: false
  use_abs_pos: true
  use_checkpoint: false
  # Stress init keeps JVP/FD non-trivial in a tiny 6-step smoke.
  # Production full-run config below switches to official_zero.
  meanflow_init_scheme: stress_nonzero
  meanflow_adaln_init_std: 0.02
  meanflow_final_linear_init: xavier

optimizer:
  lr: 0.0001
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.0
  max_grad_norm: 1.0

meanflow:
  precision_recipe: bf16_backbone_fp32_jvp
  equal_prob: 0.75
  time_sampler: ltg
  t_low: 0.05
  t_high: 0.95
  lognorm_mu: -0.4
  lognorm_sigma: 1.0
  fd_eps: 0.01
  fd_audit_every: 3

eval:
  enabled: true
  every_steps: 3
  run_at_step_1: false
  num_samples: 8
  sample_steps: 4
  precision_mode: bf16_autocast
  use_ema: true
  fixed_labels: [0, 1, 2, 3, 4, 5, 6, 7]
  # Empty means smoke will write sample_latents.safetensors and mark FID skipped.
  fid_command_template: ""
  fid_timeout_sec: 600
