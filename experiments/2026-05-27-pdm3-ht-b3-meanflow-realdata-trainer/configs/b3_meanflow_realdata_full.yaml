# Phase-0/B3 MeanFlow real-data trainer template for full ImageNet-1k PAE latent cache.
# Intended to run after /workspace/PDM/data/pae_latents/.../imagenet256_train_full is complete.
# This is single-process engineering config; distributed scaling can be added after loop validation.

data:
  data_path: /workspace/PDM/data/pae_latents/PAE_DINOv2L_d32/imagenet256_train_full
  file_glob: "*.safetensors"
  expected_total: 1281167
  image_size: 256
  num_classes: 1000
  num_workers: 8
  prefetch_factor: 4
  persistent_workers: true
  shuffle: true
  drop_last: true
  latent_norm: false
  latent_multiplier: 1.0
  flip_prob: 0.5
  skip_unreadable: true
  label_preview_count: 4096

vae:
  model_name: PAE_DINOv2L_d32
  downsample_ratio: 16
  latent_dim: 32

train:
  exp_name: fullcache_realdata_singleproc_template
  output_dir: /workspace/PDM/experiments/2026-05-27-pdm3-ht-b3-meanflow-realdata-trainer/results
  # Short-run default for engineering; set to production schedule for main Phase 0.
  max_steps: 100000
  global_batch_size: 4
  global_seed: 20260527
  device: auto
  log_every: 50
  use_ema: true
  ema_decay: 0.9999
  sdpa_kernel: math
  allow_tf32: false
  checkpoint_every: 1000
  keep_last_checkpoints: 5
  resume_from: auto
  restore_rng: true

model:
  # Production-size B3 MeanFlow wrapper over official PAE LightningDiT XL/1.
  # If memory audit fails, first reduce global_batch_size or switch to B/S for engineering.
  model_type: B3MeanFlowLightningDiT-XL/1
  in_chans: 32
  class_dropout_prob: 0.1
  use_qknorm: false
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  wo_shift: false
  use_abs_pos: true
  use_checkpoint: false
  meanflow_init_scheme: official_zero
  meanflow_adaln_init_std: 0.02
  meanflow_final_linear_init: official_zero

optimizer:
  lr: 0.0002
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.0
  max_grad_norm: 1.0

meanflow:
  precision_recipe: bf16_backbone_fp32_jvp
  equal_prob: 0.75
  time_sampler: ltg
  t_low: 0.05
  t_high: 0.95
  lognorm_mu: -0.4
  lognorm_sigma: 1.0
  fd_eps: 0.01
  fd_audit_every: 1000

eval:
  enabled: true
  every_steps: 10000
  run_at_step_1: false
  num_samples: 64
  sample_steps: 32
  precision_mode: bf16_autocast
  use_ema: true
  fixed_labels: null
  # Fill this once decoder/FID pipeline is wired. Placeholders available:
  # {sample_dir}, {output_dir}, {step}
  fid_command_template: ""
  fid_timeout_sec: 7200
