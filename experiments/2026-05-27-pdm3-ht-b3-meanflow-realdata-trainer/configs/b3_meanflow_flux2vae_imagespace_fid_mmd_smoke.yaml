# Phase-0/B3 FLUX.2 VAE image-space eval smoke with real ImageNet-256 FID/MMD.
#
# This is an integration smoke: it only samples/decodes 4 images, so the
# numeric FID/KID values are not scientifically meaningful.  Its purpose is to
# prove that the trainer -> FLUX decode hook -> real Inception metric command
# path is wired against full ImageNet-256 reference stats.

data:
  data_path: /workspace/PDM/data/vae_latents/AutoencoderKLFlux2_d32/imagenet256_train_full
  file_glob: "latents_rank00_shard*.safetensors"
  max_shards: 1
  expected_total: 4096
  image_size: 256
  num_classes: 1000
  num_workers: 2
  prefetch_factor: 2
  persistent_workers: true
  shuffle: true
  drop_last: true
  latent_norm: false
  latent_multiplier: 1.0
  flip_prob: 0.5
  skip_unreadable: true
  label_preview_count: 2048

vae:
  model_name: AutoencoderKLFlux2_d32
  downsample_ratio: 8
  latent_dim: 32
  latent_shape: [32, 32, 32]
  latent_source: diffusers/FLUX.2-dev-bnb-4bit/subfolder=vae
  latent_mode: posterior.mode

train:
  exp_name: smoke_flux2vae_imagespace_fid_mmd
  output_dir: /workspace/PDM/experiments/2026-05-27-pdm3-ht-b3-meanflow-realdata-trainer/results
  max_steps: 3
  global_batch_size: 4
  global_seed: 20260528
  device: auto
  log_every: 1
  use_ema: true
  ema_decay: 0.9999
  sdpa_kernel: math
  allow_tf32: false
  checkpoint_every: 3
  keep_last_checkpoints: 4
  resume_from: null
  restore_rng: true

model:
  model_type: B3MeanFlowLightningDiT-Custom
  patch_size: 2
  hidden_size: 128
  depth: 2
  num_heads: 4
  in_chans: 32
  class_dropout_prob: 0.1
  use_qknorm: false
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  wo_shift: false
  use_abs_pos: true
  use_checkpoint: false
  meanflow_init_scheme: stress_nonzero
  meanflow_adaln_init_std: 0.02
  meanflow_final_linear_init: xavier

optimizer:
  lr: 0.0001
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.0
  max_grad_norm: 1.0

meanflow:
  precision_recipe: bf16_backbone_fp32_jvp
  equal_prob: 0.75
  time_sampler: ltg
  t_low: 0.05
  t_high: 0.95
  lognorm_mu: -0.4
  lognorm_sigma: 1.0
  fd_eps: 0.01
  fd_audit_every: 3

eval:
  enabled: true
  every_steps: 3
  run_at_step_1: false
  num_samples: 4
  sample_steps: 4
  precision_mode: bf16_autocast
  use_ema: true
  fixed_labels: [0, 1, 2, 3]
  fid_command_template: "python /workspace/PDM/experiments/2026-05-27-pdm3-ht-b3-meanflow-realdata-trainer/scripts/eval_flux2vae_imagespace.py --sample-dir {sample_dir} --output-dir {output_dir} --step {step} --device cuda:0 --batch-size 4 --max-images 4 --images-subdir decoded_flux2vae_png_realmetrics --save-grid --fid-command-template 'python /workspace/PDM/experiments/2026-05-27-pdm3-ht-b3-meanflow-realdata-trainer/scripts/eval_imagespace_fid_mmd.py --images-dir {{images_dir}} --ref-stats /workspace/PDM/data/reference_stats/imagenet256_adm_train_inception2048/imagenet256_train_adm_inception2048_stats.npz --ref-features /workspace/PDM/data/reference_stats/imagenet256_adm_train_inception2048/imagenet256_train_adm_inception2048_mmd8192_features.npz --output-json {sample_dir}/fid_mmd_metrics_real_imagenet256.json --batch-size 4 --num-workers 0 --device cuda:0 --sqrt-device cuda:0 --mmd-device cuda:0 --mmd-max-ref 8192'"
  fid_timeout_sec: 1200

